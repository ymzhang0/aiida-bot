[project]
name = "aiida-bot"
version = "0.1.0"
description = "Provenance-aware AiiDA process watcher and desktop notifier."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["aiida-core>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
aiida-bot = "aiida_bot.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiida_bot"]
